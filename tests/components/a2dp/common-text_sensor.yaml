a2dp:
  id: a2dp_hub
  device_name: ESPHome A2DP Test
  auto_start: false

a2dp_avrcp:
  id: avrcp_ctrl
  a2dp_id: a2dp_hub

text_sensor:
  - platform: a2dp
    id: a2dp_track_title
    name: Track Title
    type: title

  - platform: a2dp
    id: a2dp_track_artist
    name: Track Artist
    type: artist

  - platform: a2dp
    id: a2dp_track_album
    name: Track Album
    type: album
