a2dp:
  id: a2dp_hub
  device_name: ESPHome A2DP Sink Test
  auto_start: false

a2dp_sink:
  id: a2dp_receiver
  a2dp_id: a2dp_hub

a2dp_sink:
  avrcp:
    id: sink_avrcp
    a2dp_sink_id: a2dp_receiver
    on_volume_changed:
      - logger.log:
          format: "Sink volume: %u/127"
          args: [x]
